[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d7-factory-studio"
version = "0.1.0"
description = "D7 production, commissioning and service workstation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "PyYAML>=6.0,<7",
  "paramiko>=3.5,<5",
  "pyserial>=3.5,<4",
  "pyqtgraph>=0.13.7,<0.15",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
d7-factory-studio = "d7_factory_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d7_factory_studio = ["config/*.yaml", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
